<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboPulse Community Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header -->

<header>

    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png"
         alt="Robot Logo"
         class="logo">

    <h1>RoboPulse Community</h1>

</header>

<!-- Navigation -->

<nav>

    <ul>

        <li>
            <a href="#">Home</a>

            <ul class="dropdown">
                <li><a href="#">AI News</a></li>
                <li><a href="#">Robotics</a></li>
                <li><a href="#">Tutorials</a></li>
                <li><a href="#">Events</a></li>
            </ul>

        </li>

        <li><a href="#">About</a></li>

        <li><a href="#">Models</a></li>

        <li><a href="#">Contact</a></li>

    </ul>

</nav>

<!-- Forms -->

<section class="container">

    <!-- Sign In -->

    <div class="box">

        <h2>Sign In</h2>

        <form>

            <label>Email</label>

            <input type="email"
                   placeholder="Enter Email">

            <label>Password</label>

            <input type="password"
                   placeholder="Enter Password">

            <input type="submit"
                   value="Sign In">

        </form>

    </div>

    <!-- Sign Up -->

    <div class="box">

        <h2>Sign Up</h2>

        <form>

            <label>Name</label>

            <input type="text"
                   placeholder="Enter Name">

            <label>Email</label>

            <input type="email"
                   placeholder="Enter Email">

            <label>Password</label>

            <input type="password"
                   placeholder="Create Password">

            <input type="submit"
                   value="Create Account">

        </form>

    </div>

</section>

<!-- Footer -->

<footer>

    <p>RoboPulse AI & Robotics Community</p>

    <p>
        Chennai, Tamil Nadu
    </p>

    <p>
        © 2026-2027 | Register No: URK24CS1087 <br>
    </p>

</footer>

</body>
</html>
